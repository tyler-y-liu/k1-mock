<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@600;800&family=Noto+Sans+HK:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;background:#e9eef3;font-family:"Noto Sans HK",sans-serif}
.card{position:absolute;inset:40px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);display:grid;grid-template-columns:1fr 400px;overflow:hidden}
.l{padding:52px 0 0 60px;display:flex;flex-direction:column;gap:16px}
h1{font:800 54px "Chiron GoRound TC",sans-serif;margin:0;color:#1f2933;letter-spacing:0;white-space:nowrap}
.sub{font:600 34px "Chiron GoRound TC",sans-serif;color:#d6402f;margin:0}
ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:10px;font-size:26px;color:#3b4652}
li::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#d6402f;margin-right:14px;vertical-align:middle}
.url{margin-top:auto;padding-bottom:40px;font-size:23px;color:#6b7785}
.r{background:#f6f8fa;border-left:2px dashed #c9d2dc;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;padding:24px}
.row{display:flex;gap:26px;align-items:flex-end;justify-content:center}
.prop{position:relative;display:block;flex:none}
.prop .ph{position:absolute;inset:0;border-radius:16px}
.prop.ok .ph{display:none}
.prop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;z-index:1}
.dots{display:flex;gap:12px}
.dot{width:44px;height:44px;border-radius:50%;border:2.5px solid #1f2933}
</style>
<div class="card">
 <div class="l">
  <h1>K1 數學模擬卷（第五套）</h1>
  <p class="sub">廣東話讀題 · 18 題</p>
  <ul><li>平板上直接圈答案、連線</li><li>三個新題型：一樣多、數的分解、圖形組合</li><li>免費、免註冊，有 A4 打印版</li></ul>
  <div class="url">k1-maths-mock.latentyonder.com/set5</div>
 </div>
 <div class="r">
  <div class="row">
   <span class="prop" style="width:170px;height:128px"><span class="ph" style="background:#f6d06a"></span><img onload="this.parentNode.classList.add('ok')" onerror="this.remove()" src="img/set5/monkey.png" alt=""></span>
   <span class="prop" style="width:112px;height:150px"><span class="ph" style="background:#f2a08c"></span><img onload="this.parentNode.classList.add('ok')" onerror="this.remove()" src="img/set5/pig.png" alt=""></span>
  </div>
  <div class="row">
   <span class="prop" style="width:150px;height:112px"><span class="ph" style="background:#8fd9a8"></span><img onload="this.parentNode.classList.add('ok')" onerror="this.remove()" src="img/set5/boat.png" alt=""></span>
   <span class="prop" style="width:100px;height:132px"><span class="ph" style="background:#a8c6f0"></span><img onload="this.parentNode.classList.add('ok')" onerror="this.remove()" src="img/set5/sheep.png" alt=""></span>
  </div>
  <div class="row dots"><span class="dot" style="background:#e5483b"></span><span class="dot" style="background:#3f7fd8"></span><span class="dot" style="background:#4bb05a"></span><span class="dot" style="background:#f6c443"></span><span class="dot" style="background:#9b59b6"></span></div>
 </div>
</div>
